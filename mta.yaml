_schema-version: 3.3.0
ID: BridgeManagementV2
version: 2.0.10
description: "Bridge Management System — NSW standalone"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: BridgeManagementV2-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      health-check-type: none
    properties:
      DEFAULT_STATE: NSW
      MULTI_STATE_ENABLED: "false"
      APP_VERSION: "2.0.9-nsw-standalone"
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: BridgeManagementV2-auth
      - name: BridgeManagementV2-db
      - name: BridgeManagementV2-destination
      - name: BridgeManagementV2-logging
      - name: BridgeManagementV2-autoscaler

  - name: BridgeManagementV2-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      ignore:
        - node_modules/
        - .env
    requires:
      - name: BridgeManagementV2-db

  - name: BridgeManagementV2
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: BridgeManagementV2-auth
      - name: BridgeManagementV2-destination
      - name: BridgeManagementV2-html5-runtime
      - name: BridgeManagementV2-logging
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: BridgeManagementV2-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: BridgeManagementV2adminbridges
          artifacts:
            - admin-bridges.zip
          target-path: app/
        - name: BridgeManagementV2mapview
          artifacts:
            - map-view.zip
          target-path: app/
        - name: BridgeManagementV2massedit
          artifacts:
            - mass-edit.zip
          target-path: app/
        - name: BridgeManagementV2restrictions
          artifacts:
            - restrictions.zip
          target-path: app/
        - name: BridgeManagementV2attributesadmin
          artifacts:
            - attributes-admin.zip
          target-path: app/
        - name: BridgeManagementV2bmsadmin
          artifacts:
            - bms-admin.zip
          target-path: app/
        - name: BridgeManagementV2dashboard
          artifacts:
            - dashboard.zip
          target-path: app/
        - name: BridgeManagementV2massupload
          artifacts:
            - mass-upload.zip
          target-path: app/
        - name: BridgeManagementV2operationsbridges
          artifacts:
            - operations-bridges.zip
          target-path: app/
        - name: BridgeManagementV2operationsrestrictions
          artifacts:
            - operations-restrictions.zip
          target-path: app/
    requires:
      - name: BridgeManagementV2-auth
      - name: srv-api
      - name: BridgeManagementV2-html5-repo-host
        parameters:
          content-target: true

  - name: BridgeManagementV2adminbridges
    type: html5
    path: app/admin-bridges
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  - name: BridgeManagementV2mapview
    type: html5
    path: app/map-view
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  - name: BridgeManagementV2massedit
    type: html5
    path: app/mass-edit
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  - name: BridgeManagementV2restrictions
    type: html5
    path: app/restrictions
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  - name: BridgeManagementV2bmsadmin
    type: html5
    path: app/bms-admin
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  - name: BridgeManagementV2attributesadmin
    type: html5
    path: app/attributes-admin
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  - name: BridgeManagementV2dashboard
    type: html5
    path: app/dashboard
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  - name: BridgeManagementV2massupload
    type: html5
    path: app/mass-upload
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  - name: BridgeManagementV2operationsbridges
    type: html5
    path: app/operations/bridges
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  - name: BridgeManagementV2operationsrestrictions
    type: html5
    path: app/operations/restrictions
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

resources:
  - name: BridgeManagementV2-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: BridgeManagementV2-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: "BMS Admin V2 (${org}-${space})"
            description: "Full BMS administration"
            role-template-references:
              - "$XSAPPNAME.BMS_ADMIN"
          - name: "BMS Bridge Manager V2 (${org}-${space})"
            description: "Bridge register management"
            role-template-references:
              - "$XSAPPNAME.BMS_BRIDGE_MANAGER"
          - name: "BMS Operator V2 (${org}-${space})"
            description: "Bridge operations"
            role-template-references:
              - "$XSAPPNAME.BMS_OPERATOR"
          - name: "BMS Viewer V2 (${org}-${space})"
            description: "Read-only access"
            role-template-references:
              - "$XSAPPNAME.BMS_VIEWER"
    requires:
      - name: app-api

  - name: BridgeManagementV2-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: BridgeManagementV2-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: BridgeManagementV2-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: BridgeManagementV2-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: BridgeManagementV2-logging
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite

  - name: BridgeManagementV2-autoscaler
    type: org.cloudfoundry.managed-service
    parameters:
      service: autoscaler
      service-plan: standard

